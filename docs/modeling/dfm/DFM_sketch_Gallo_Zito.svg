<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850">
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #111827; }
      .subtitle { font-family: Arial, sans-serif; font-size: 14px; fill: #374151; }
      .fact-title { font-family: Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #111827; }
      .measure { font-family: Arial, sans-serif; font-size: 13px; fill: #111827; }
      .dim { font-family: Arial, sans-serif; font-size: 13px; fill: #111827; }
      .small { font-family: Arial, sans-serif; font-size: 11px; fill: #4b5563; }
      .note { font-family: Arial, sans-serif; font-size: 12px; fill: #374151; }
      .fact { fill: #f8fafc; stroke: #111827; stroke-width: 1.6; }
      .node { fill: #ffffff; stroke: #111827; stroke-width: 1.3; }
      .link { stroke: #374151; stroke-width: 1.1; fill: none; }
      .hier { stroke: #6b7280; stroke-width: 1.1; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="25" y="25" width="1150" height="800" fill="#ffffff" stroke="#d1d5db" stroke-width="1"/>

  <text x="600" y="60" text-anchor="middle" class="title">Preliminary DFM Sketch</text>
  <text x="600" y="84" text-anchor="middle" class="subtitle">Energy Security in Europe Under Geopolitical Risk</text>

  <!-- TIME hierarchy -->
  <circle cx="520" cy="140" r="8" class="node"/>
  <text x="520" y="122" text-anchor="middle" class="dim">month</text>
  <circle cx="440" cy="95" r="7" class="node"/>
  <text x="440" y="77" text-anchor="middle" class="dim">quarter</text>
  <circle cx="520" cy="95" r="7" class="node"/>
  <text x="520" y="77" text-anchor="middle" class="dim">semester</text>
  <circle cx="600" cy="95" r="7" class="node"/>
  <text x="600" y="77" text-anchor="middle" class="dim">year</text>
  <path d="M513 136 L447 99" class="hier"/>
  <path d="M520 132 L520 102" class="hier"/>
  <path d="M527 136 L593 99" class="hier"/>
  <text x="520" y="165" text-anchor="middle" class="small">TIME</text>

  <!-- COUNTRY hierarchy -->
  <circle cx="885" cy="140" r="8" class="node"/>
  <text x="885" y="122" text-anchor="middle" class="dim">country</text>
  <circle cx="815" cy="95" r="7" class="node"/>
  <text x="815" y="77" text-anchor="middle" class="dim">EU region</text>
  <circle cx="955" cy="95" r="7" class="node"/>
  <text x="955" y="77" text-anchor="middle" class="dim">EU / Europe</text>
  <path d="M879 136 L822 99" class="hier"/>
  <path d="M891 136 L948 99" class="hier"/>
  <text x="885" y="165" text-anchor="middle" class="small">COUNTRY</text>

  <!-- ENERGY PRODUCT hierarchy -->
  <circle cx="190" cy="350" r="8" class="node"/>
  <text x="190" y="333" text-anchor="middle" class="dim">energy product</text>
  <circle cx="115" cy="300" r="7" class="node"/>
  <text x="115" y="282" text-anchor="middle" class="dim">category</text>
  <circle cx="265" cy="300" r="7" class="node"/>
  <text x="265" y="282" text-anchor="middle" class="dim">energy family</text>
  <path d="M184 346 L122 304" class="hier"/>
  <path d="M196 346 L258 304" class="hier"/>

  <!-- PRICE DETAIL dimensions -->
  <circle cx="1010" cy="475" r="8" class="node"/>
  <text x="1010" y="458" text-anchor="middle" class="dim">energy type</text>
  <circle cx="1010" cy="535" r="8" class="node"/>
  <text x="1010" y="518" text-anchor="middle" class="dim">consumer type</text>
  <circle cx="1010" cy="595" r="8" class="node"/>
  <text x="1010" y="578" text-anchor="middle" class="dim">consumption band</text>
  <circle cx="1010" cy="655" r="8" class="node"/>
  <text x="1010" y="638" text-anchor="middle" class="dim">tax type</text>

  <!-- RISK LEVEL hierarchy -->
  <circle cx="700" cy="715" r="8" class="node"/>
  <text x="700" y="741" text-anchor="middle" class="dim">risk level</text>
  <circle cx="610" cy="775" r="7" class="node"/>
  <text x="610" y="802" text-anchor="middle" class="dim">low</text>
  <circle cx="700" cy="775" r="7" class="node"/>
  <text x="700" y="802" text-anchor="middle" class="dim">medium</text>
  <circle cx="790" cy="775" r="7" class="node"/>
  <text x="790" y="802" text-anchor="middle" class="dim">high</text>
  <path d="M694 720 L616 770" class="hier"/>
  <path d="M700 723 L700 768" class="hier"/>
  <path d="M706 720 L784 770" class="hier"/>

  <!-- Fact boxes -->
  <rect x="350" y="230" width="260" height="115" class="fact"/>
  <line x1="350" y1="263" x2="610" y2="263" stroke="#111827" stroke-width="1.1"/>
  <text x="480" y="252" text-anchor="middle" class="fact-title">IMPORT DEPENDENCY</text>
  <text x="370" y="292" class="measure">import_dependency_rate</text>
  <text x="370" y="318" class="small">Eurostat nrg_ind_id</text>

  <rect x="680" y="230" width="260" height="115" class="fact"/>
  <line x1="680" y1="263" x2="940" y2="263" stroke="#111827" stroke-width="1.1"/>
  <text x="810" y="252" text-anchor="middle" class="fact-title">EMERGENCY OIL STOCKS</text>
  <text x="700" y="292" class="measure">emergency_stock_days</text>
  <text x="700" y="318" class="small">Eurostat nrg_stk_oem</text>

  <rect x="350" y="475" width="260" height="130" class="fact"/>
  <line x1="350" y1="508" x2="610" y2="508" stroke="#111827" stroke-width="1.1"/>
  <text x="480" y="497" text-anchor="middle" class="fact-title">ENERGY PRICE</text>
  <text x="370" y="535" class="measure">energy_price</text>
  <text x="370" y="558" class="measure">price_unit</text>
  <text x="370" y="585" class="small">Eurostat nrg_pc_202 / nrg_pc_204</text>

  <rect x="680" y="475" width="260" height="130" class="fact"/>
  <line x1="680" y1="508" x2="940" y2="508" stroke="#111827" stroke-width="1.1"/>
  <text x="810" y="497" text-anchor="middle" class="fact-title">GEOPOLITICAL RISK</text>
  <text x="700" y="535" class="measure">gpr_index</text>
  <text x="700" y="558" class="measure">gpr_threats</text>
  <text x="700" y="581" class="measure">gpr_acts</text>
  <text x="700" y="597" class="small">Caldara-Iacoviello GPR</text>

  <!-- Connections from facts to dimensions -->
  <path d="M480 230 C480 195 500 175 517 148" class="link"/>
  <path d="M810 230 C740 190 620 165 528 143" class="link"/>
  <path d="M480 475 C450 360 480 230 516 148" class="link"/>
  <path d="M810 475 C730 350 620 215 527 146" class="link"/>

  <path d="M610 250 C700 205 805 165 878 144" class="link"/>
  <path d="M810 230 C825 190 855 162 880 147" class="link"/>
  <path d="M610 520 C700 385 800 230 881 148" class="link"/>

  <path d="M350 300 C285 310 230 330 198 348" class="link"/>

  <path d="M610 520 C770 485 910 476 1002 475" class="link"/>
  <path d="M610 535 C770 535 910 535 1002 535" class="link"/>
  <path d="M610 550 C770 580 910 592 1002 595" class="link"/>
  <path d="M610 565 C770 635 910 652 1002 655" class="link"/>

  <path d="M810 605 C785 650 745 690 707 712" class="link"/>

  <!-- Note -->
  <rect x="90" y="670" width="420" height="100" fill="#f9fafb" stroke="#d1d5db" stroke-width="1"/>
  <text x="110" y="700" class="note">Modeling choice:</text>
  <text x="110" y="724" class="note">The DFM is a constellation of fact schemata sharing Time</text>
  <text x="110" y="746" class="note">and Country. This preserves monthly, semi-annual, and</text>
  <text x="110" y="768" class="note">annual granularities while supporting drill-across queries.</text>
</svg>
